interface=wlan0
driver=nl80211
ssid=StashPi
hw_mode=g
channel=6
ieee80211n=1
wmm_enabled=1
auth_algs=1
ignore_broadcast_ssid=0

# start-stop-daemon backgrounds this process with stdio going to
# /dev/null, so without syslog logging a startup failure leaves no
# trace anywhere - check /var/log/messages (or `logread`) for these.
logger_syslog=-1
logger_syslog_level=0
ctrl_interface=/var/run/hostapd
ctrl_interface_group=0
