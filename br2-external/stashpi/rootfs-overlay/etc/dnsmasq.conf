interface=wlan0
bind-dynamic

dhcp-range=1.1.1.2,1.1.1.100,255.255.255.0,12h
dhcp-option=option:router,1.1.1.1
dhcp-option=option:dns-server,1.1.1.1

# No internet uplink on this network - there's nowhere to forward
# lookups to. Answering NXDOMAIN (rather than redirecting every query
# to ourselves) avoids tripping captive-portal probes into a dead-end
# popup; connect and browse to http://1.1.1.1/ directly instead.
no-resolv
